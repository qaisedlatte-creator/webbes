name: Abandoned cart reminder cron

on:
  schedule:
    # Every 30 minutes — Vercel Hobby plan's own Cron Jobs only run once a
    # day, too coarse for a ~2-3h abandoned-cart window, so this repo's
    # scheduler does the polling instead and just pings the API route.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger abandoned-cart check
        run: |
          curl -sf -X GET "https://www.webbes.in/api/templates/cron/abandoned-cart" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
